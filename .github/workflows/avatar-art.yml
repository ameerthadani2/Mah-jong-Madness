name: Import avatar art
# Upload portrait images (auntie.png, uncle.jpg, …) and animated clips (auntie-idle.mp4,
# auntie-win.mp4, auntie-lose.mp4, …) to apps/mobile/assets/avatars/ from the GitHub website;
# this workflow resizes stills to 384×384 PNG, converts clips to small looping WebP, wires them
# into the app, commits, and rebuilds the web preview.
on:
  push:
    paths: ['apps/mobile/assets/avatars/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: avatar-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure ImageMagick and ffmpeg
        run: |
          need=""
          command -v convert >/dev/null || command -v magick >/dev/null || need="$need imagemagick"
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          if [ -n "$need" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $need; fi
      - name: Resize and register portraits
        id: import
        run: |
          # Without pipefail the step would take tee's exit status and report a failed import as done.
          set -o pipefail
          STATUS=0
          node apps/mobile/scripts/import-avatars.cjs 2>&1 | tee import.log || STATUS=$?
          echo "## Avatar art" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' import.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error title=Avatar import failed::The import script stopped with exit code $STATUS; nothing was imported (the job summary has its output)."
            exit "$STATUS"
          fi
      - name: Commit the processed images
        run: |
          git add -A apps/mobile/assets/avatars apps/mobile/src/components/portraits/images.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import avatar art (resized to 384x384)"
          git push
      - name: Rebuild the web preview with the new art
        # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start them explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run web-preview.yml --ref "$GITHUB_REF_NAME" || echo "web preview not started"

