name: CI
on:
  push:
    branches: ['**']
  pull_request:

# The jobs only read the repository; nothing here needs more.
permissions:
  contents: read

# A newer push to a working branch replaces the run for the older one. Runs on the default
# branch (read from the event, whatever it is called) are never cancelled: the deploy workflow
# starts from a finished CI run of that branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    # A pull request from a branch of this repository is already tested by its push; only a pull
    # request from a fork runs here, so the suite does not run twice for one commit.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The signal server's Postgres repository and migration tests run against this database
    # (each run creates and drops its own schema); without DATABASE_URL_TEST they are skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      # Every workspace's tests with coverage. Fails when a test fails or a workspace falls below a floor in its
      # vitest.config.ts (coverage.thresholds; docs/ARCHITECTURE.md, How the app is tested).
      - run: npm run coverage
      # The repository's own tests in tests/ (the rest of what `npm test` runs): the workflows' steps, the release
      # configuration, the app's catalogue against the server's, and the server's tests staying inside apps/signal.
      - run: npm run test:repo
      # The app's render tests: components and screens rendered under jest (apps/mobile/jest.config.js).
      - run: npm run test:render
      - run: npm run sim -- 40
      # Bot strength gate: 2,000 fixed-seed hands compared hand by hand with a recorded reference. Fails on a drop of more
      # than 1 point a hand for Pro against Club or for Pro against Pro without its deal-in and 台 terms (docs/ARCHITECTURE.md).
      - run: npm run sim -- --gate

  docker:
    # The image fly.toml deploys: build it from the repository root, boot it as production boots it
    # (NODE_ENV=production in the image, Postgres through DATABASE_URL, migrations at boot and an
    # AUTH_PEPPER; no ALLOW_EPHEMERAL), check /health and play a hand against it with the smoke test
    # expecting Postgres storage, as the deploy workflow does against the live machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Build the signal server image
        run: docker build -f apps/signal/Dockerfile -t mahjong-signal:ci .
      - name: Boot it on Postgres and check /health
        # The host network, so the container reaches the Postgres service on localhost:5432. The
        # pepper is made for this run only; nothing it protects outlives the job.
        run: |
          docker run -d --name signal --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e MIGRATE_ON_BOOT=1 \
            -e AUTH_PEPPER="ci-$(openssl rand -hex 24)" \
            mahjong-signal:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs signal
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @mjm/signal --workspace @mjm/engine --workspace @mjm/net
      - name: Play a hand against the image (the same smoke test that runs after a deploy)
        run: npm run smoke -w @mjm/signal -- http://127.0.0.1:8787 --expect-storage pg
      - name: Stop the container
        if: always()
        run: |
          docker logs signal > signal.log 2>&1 || true
          docker rm -f signal > /dev/null 2>&1 || true

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        working-directory: apps/mobile
        run: npx playwright install --with-deps chromium
      - name: Play a full hand through the UI
        working-directory: apps/mobile
        run: npm run e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e-shots

