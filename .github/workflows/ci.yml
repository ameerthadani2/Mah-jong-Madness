name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # The signal server's Postgres repository and migration tests run against this database
    # (each run creates and drops its own schema); without DATABASE_URL_TEST they are skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run sim -- 40

  docker:
    # The image fly.toml deploys: build it from the repository root and check that it boots and
    # answers /health with no secrets (in-memory storage, guest-only sign-in). The image sets
    # NODE_ENV=production, which refuses to start without DATABASE_URL and AUTH_PEPPER unless
    # ALLOW_EPHEMERAL=1 says the in-memory server is wanted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the signal server image
        run: docker build -f apps/signal/Dockerfile -t mahjong-signal:ci .
      - name: Boot it and check /health
        run: |
          docker run -d --name signal -p 8787:8787 -e ALLOW_EPHEMERAL=1 mahjong-signal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then echo; docker rm -f signal > /dev/null; exit 0; fi
            sleep 1
          done
          docker logs signal
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        working-directory: apps/mobile
        run: npx playwright install --with-deps chromium
      - name: Play a full hand through the UI
        working-directory: apps/mobile
        run: npm run e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e-shots

