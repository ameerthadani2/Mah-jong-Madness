name: Publish to Expo Go
# Phone-only path: publishes the JS bundle with EAS Update so the app can be opened in
# Expo Go without any computer. Needs one repository secret: EXPO_TOKEN
# (expo.dev → Account settings → Access tokens). Optional secret EXPO_OWNER = your Expo username/org.
on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        default: Manual publish
        required: false
  push:
    branches: [claude/p2p-taiwanese-mahjong-app-9lzdls, main]
    paths: [apps/mobile/**, packages/**]

concurrency:
  group: expo-publish
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> $GITHUB_OUTPUT
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "## Not published yet — add the EXPO_TOKEN secret" >> $GITHUB_STEP_SUMMARY
            echo "1. expo.dev → Account settings → Access tokens → Create token" >> $GITHUB_STEP_SUMMARY
            echo "2. GitHub → Settings → Secrets and variables → Actions → New repository secret: EXPO_TOKEN (and optionally EXPO_OWNER = your Expo username)" >> $GITHUB_STEP_SUMMARY
            echo "3. Re-run this workflow." >> $GITHUB_STEP_SUMMARY
            echo "::notice::EXPO_TOKEN secret missing — skipping publish (see the job summary for the two steps to fix it)"
          fi
  publish:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Create or link the EAS project (first run only)
        working-directory: apps/mobile
        env:
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
        run: |
          if node -e "const c=require('./app.json'); process.exit(c.expo.extra && c.expo.extra.eas && c.expo.extra.eas.projectId ? 0 : 1)"; then
            echo "EAS project already linked"
          else
            eas init --force --non-interactive
            eas update:configure --non-interactive
            node scripts/pin-runtime.js
          fi
      - name: Publish update
        working-directory: apps/mobile
        run: eas update --branch preview --message "${{ github.event.inputs.message || github.event.head_commit.message || 'CI publish' }}" --non-interactive
      - name: Commit EAS project id back to the branch (first run only)
        run: |
          if ! git diff --quiet -- apps/mobile/app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/app.json
            git commit -m "Link EAS project (automated)"
            git push
          fi
      - name: How to open it
        working-directory: apps/mobile
        run: |
          echo "## Open in Expo Go" >> $GITHUB_STEP_SUMMARY
          echo "1. Install **Expo Go** from the App Store and sign in with the same Expo account." >> $GITHUB_STEP_SUMMARY
          echo "2. The project appears under *Projects*; tap it, then the **preview** branch." >> $GITHUB_STEP_SUMMARY
          echo "Project: $(node -e "console.log(require('./app.json').expo.extra.eas.projectId)")" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: https://expo.dev/accounts/${{ secrets.EXPO_OWNER || 'me' }}/projects/mahjong-madness/updates" >> $GITHUB_STEP_SUMMARY
