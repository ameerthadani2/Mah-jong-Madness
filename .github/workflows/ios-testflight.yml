name: iOS TestFlight build
# Builds the iOS app in the EAS cloud and submits it to TestFlight, entirely from GitHub.
# Secrets needed (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN            expo.dev access token
#   ASC_KEY_ID            App Store Connect API key id        (App Store Connect → Users and Access → Integrations → Team Keys)
#   ASC_ISSUER_ID         App Store Connect API issuer id
#   ASC_KEY_P8            full contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID         10-character team id (developer.apple.com → Membership)
#   ASC_APP_ID            (optional) numeric App Store Connect app id, once the app record exists
# Optional repository variables, copied into the build (all absent -> that feature is off; see docs/OWNER_TODO.md):
#   SIGNAL_URL, APP_STORE_ID, EXPO_PUBLIC_SENTRY_DSN, EXPO_PUBLIC_POSTHOG_KEY, EXPO_PUBLIC_POSTHOG_HOST,
#   SENTRY_ORG, SENTRY_PROJECT. SENTRY_AUTH_TOKEN and google-services.json belong in EAS environment
#   variables (secret / file), never here.
# The app uses native modules (notifications, Sentry, purchases), so it runs only in builds like this one
# or a development build; Expo Go cannot open it any more.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        default: production
        type: choice
        options: [production, preview]
      submit:
        description: Submit to TestFlight after building
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Write App Store Connect API key
        run: |
          echo "${{ secrets.ASC_KEY_P8 }}" > $RUNNER_TEMP/AuthKey.p8
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> $GITHUB_ENV
          echo "EXPO_ASC_KEY_ID=${{ secrets.ASC_KEY_ID }}" >> $GITHUB_ENV
          echo "EXPO_ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}" >> $GITHUB_ENV
          echo "EXPO_APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION" >> $GITHUB_ENV
      - name: Create or link the EAS project (first run only)
        working-directory: apps/mobile
        run: |
          if node -e "const c=require('./app.json'); process.exit(c.expo.extra && c.expo.extra.eas && c.expo.extra.eas.projectId ? 0 : 1)"; then
            echo "EAS project already linked"
          else
            eas init --force --non-interactive
          fi
      - name: Commit the EAS project id back to the branch (first run only)
        run: |
          if ! git diff --quiet -- apps/mobile/app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/app.json
            git commit -m "Link EAS project (automated)"
            git push
          fi
      - name: Pass build-time variables to the EAS build profile
        # EAS cloud builds do not inherit this job's environment; the profile's env does reach them.
        # Only public values go here (they end up in the app bundle anyway). The edit is not committed.
        working-directory: apps/mobile
        env:
          PROFILE: ${{ github.event.inputs.profile }}
          SIGNAL_URL: ${{ vars.SIGNAL_URL }}
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          node -e "
            const fs = require('fs');
            const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            const keys = ['SIGNAL_URL', 'APP_STORE_ID', 'EXPO_PUBLIC_SENTRY_DSN', 'EXPO_PUBLIC_POSTHOG_KEY', 'EXPO_PUBLIC_POSTHOG_HOST', 'SENTRY_ORG', 'SENTRY_PROJECT'];
            const profile = eas.build[process.env.PROFILE];
            profile.env = { ...(profile.env || {}) };
            for (const k of keys) if (process.env[k]) profile.env[k] = process.env[k];
            fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2));
            console.log('Build variables set: ' + (Object.keys(profile.env).join(', ') || 'none'));
          "
      - name: Build (and submit) on EAS
        working-directory: apps/mobile
        run: |
          if [ "${{ github.event.inputs.submit }}" = "true" ]; then
            eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive --auto-submit --wait
          else
            eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive --wait
          fi
      - name: Where to find it
        run: |
          echo "## Done" >> $GITHUB_STEP_SUMMARY
          echo "Build list: https://expo.dev/accounts/${{ secrets.EXPO_OWNER || 'me' }}/projects/mahjong-madness/builds" >> $GITHUB_STEP_SUMMARY
          echo "TestFlight: App Store Connect → Apps → Mahjong Madness → TestFlight → Internal Testing → add yourself." >> $GITHUB_STEP_SUMMARY
