name: iOS TestFlight build
# Builds the iOS app in the EAS cloud and submits it to TestFlight, entirely from GitHub. See docs/RUN_ON_IOS.md.
# Secrets needed (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN            expo.dev access token
#   ASC_KEY_ID            App Store Connect API key id        (App Store Connect → Users and Access → Integrations → Team Keys)
#   ASC_ISSUER_ID         App Store Connect API issuer id
#   ASC_KEY_P8            full contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID         10-character team id (developer.apple.com → Membership)
# Without any of them the run is skipped with a summary of what to set up.
# Submitting also needs the repository variable APP_STORE_ID: the numeric Apple ID of the app record
# you create by hand in App Store Connect (an API key cannot create it). With "submit" ticked and no
# APP_STORE_ID the run stops before anything is built and its summary says what to do.
# Repository variables copied into the build (the same as android-play.yml; see docs/OWNER_TODO.md):
#   SIGNAL_URL (required, wss://), APP_NAME, APP_SLUG, APP_SCHEME, APP_BUNDLE_ID, APP_VERSION,
#   APP_STORE_ID, EXPO_PUBLIC_LINK_DOMAIN, EXPO_PUBLIC_SENTRY_DSN, EXPO_PUBLIC_POSTHOG_KEY,
#   EXPO_PUBLIC_POSTHOG_HOST, SENTRY_ORG, SENTRY_PROJECT, EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID,
#   EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID, EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID, EXPO_PUBLIC_REVENUECAT_IOS_KEY,
#   EXPO_PUBLIC_REVENUECAT_ANDROID_KEY, EXPO_PUBLIC_TERMS_URL, EXPO_PUBLIC_PRIVACY_URL.
# A missing SIGNAL_URL, or one that is not wss:// on a public host name (an IP address, localhost
# or a private name, credentials in the address), fails the run before anything is built: a
# release build must reach the deployed server.
# SENTRY_AUTH_TOKEN and google-services.json belong in EAS environment variables (secret / file),
# never here.
# The app uses native modules (notifications, Sentry, purchases), so it runs only in builds like this one
# or a development build; Expo Go cannot open it any more.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        default: production
        type: choice
        options: [production, preview]
      submit:
        description: Submit to TestFlight after building
        default: true
        type: boolean

concurrency:
  group: mobile-build-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          SUBMIT: ${{ inputs.submit }}
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
        run: |
          MISSING=""
          for name in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            var="HAS_$name"
            if [ "${!var}" != "true" ]; then MISSING="${MISSING:+$MISSING, }$name"; fi
          done
          if [ -z "$MISSING" ]; then
            # A submission with nobody at the keyboard needs the App Store Connect app id in the submit
            # profile; without it EAS would build for 10-20 minutes and then refuse to submit.
            APP_STORE_ID="$(printf '%s' "$APP_STORE_ID" | tr -d '\r\n\t' | sed -E 's/^ +//; s/ +$//')"
            if [ "$SUBMIT" = "true" ] && ! printf '%s' "$APP_STORE_ID" | grep -Eq '^[0-9]{1,30}$'; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              if [ -z "$APP_STORE_ID" ]; then WHAT="the repository variable APP_STORE_ID is not set"; else WHAT="APP_STORE_ID is '$APP_STORE_ID', which is not a numeric App Store Connect app id"; fi
              {
                echo "## iOS build stopped: $WHAT"
                echo ""
                echo "Submitting to TestFlight needs the app record's id, and an API key cannot create the record."
                echo ""
                echo "1. App Store Connect -> Apps -> + -> New App: platform iOS, your bundle id (\`APP_BUNDLE_ID\`, default \`com.mahjongmania.app\`), a name and any SKU."
                echo "   If the bundle id is not offered yet, run this workflow once with *submit* unticked: the first build registers it."
                echo "2. Open the new app -> App Information -> copy the **Apple ID** (digits only, e.g. 1234567890)."
                echo "3. GitHub -> Settings -> Secrets and variables -> Actions -> Variables: set \`APP_STORE_ID\` to that number."
                echo "4. Run this workflow again (docs/RUN_ON_IOS.md, route 2)."
                echo ""
                echo "Nothing was built. To build without submitting, untick *submit*."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=APP_STORE_ID is needed to submit::$WHAT. Create the app record in App Store Connect and set the repository variable APP_STORE_ID to its Apple ID, or run with submit unticked (the job summary lists the steps)."
              exit 1
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## iOS build skipped: missing secret $MISSING"
            echo ""
            echo "1. expo.dev -> Account settings -> Access tokens -> create one; save it as the repository secret \`EXPO_TOKEN\`."
            echo "2. App Store Connect -> Users and Access -> Integrations -> Team Keys -> a key with the App Manager role: save its id as \`ASC_KEY_ID\`, the issuer id as \`ASC_ISSUER_ID\` and the whole .p8 file as \`ASC_KEY_P8\`."
            echo "3. developer.apple.com -> Membership: save the team id as \`APPLE_TEAM_ID\`."
            echo "4. Set the repository variable \`SIGNAL_URL\` to the deployed server (\`wss://...\`)."
            echo "5. To submit: create the app record in App Store Connect and set the repository variable \`APP_STORE_ID\` to its Apple ID (digits)."
            echo "6. Re-run this workflow (docs/RUN_ON_IOS.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$MISSING missing; skipping the iOS build (the job summary lists the setup steps)"

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROFILE: ${{ inputs.profile }}
      # Public build-time values: app.config.js reads them here (eas-cli resolves the config on this
      # runner) and the copy step below hands them to the EAS cloud build.
      SIGNAL_URL: ${{ vars.SIGNAL_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      APP_SLUG: ${{ vars.APP_SLUG }}
      APP_SCHEME: ${{ vars.APP_SCHEME }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      APP_STORE_ID: ${{ vars.APP_STORE_ID }}
      EXPO_PUBLIC_LINK_DOMAIN: ${{ vars.EXPO_PUBLIC_LINK_DOMAIN }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
      EXPO_PUBLIC_TERMS_URL: ${{ vars.EXPO_PUBLIC_TERMS_URL }}
      EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check SIGNAL_URL (a release build must reach the deployed server)
        # The same check app.config.js makes on EAS, run here so a bad address stops the run before
        # anything is built: wss://, a public host name, no IP address, no credentials.
        run: |
          node -e "
            const problem = require('./apps/mobile/app.config.js').releaseSignalUrlProblem(process.env.SIGNAL_URL);
            if (problem) {
              console.log('::error title=SIGNAL_URL cannot be used for a release build::The repository variable SIGNAL_URL: ' + problem + ' (Settings -> Secrets and variables -> Actions -> Variables; docs/DEPLOY.md)');
              process.exit(1);
            }
            console.log('Building against ' + process.env.SIGNAL_URL.trim());
          "
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION" >> "$GITHUB_ENV"
      - name: Create or link the EAS project (first run only)
        working-directory: apps/mobile
        run: |
          if node -e "const c=require('./app.json'); process.exit(c.expo.extra && c.expo.extra.eas && c.expo.extra.eas.projectId ? 0 : 1)"; then
            echo "EAS project already linked"
          else
            eas init --force --non-interactive
          fi
      - name: Commit the EAS project id back to the branch (first run only)
        run: |
          if ! git diff --quiet -- apps/mobile/app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/app.json
            git commit -m "Link EAS project (automated)"
            git push
          fi
      - name: Pass build-time variables and the App Store Connect app id to eas.json
        # EAS cloud builds do not inherit this job's environment; the profile's env does reach them.
        # Only public values go here (they end up in the app bundle anyway). APP_STORE_ID also becomes
        # the submit profile's ascAppId. The edit is not committed.
        working-directory: apps/mobile
        env:
          PLATFORM: ios
        run: node ../../.github/scripts/eas-build-env.cjs eas.json
      - name: Build (and submit) on EAS
        working-directory: apps/mobile
        env:
          SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$SUBMIT" = "true" ]; then
            eas build --platform ios --profile "$PROFILE" --non-interactive --auto-submit --wait
          else
            eas build --platform ios --profile "$PROFILE" --non-interactive --wait
          fi
      - name: Where to find it
        if: always()
        run: |
          {
            echo "## iOS build ($PROFILE)"
            echo "- Server: $SIGNAL_URL"
            echo "- Builds: expo.dev -> your project -> Builds (submissions under Submissions)"
            echo "- TestFlight: App Store Connect -> Apps -> Mahjong Mania -> TestFlight -> Internal Testing -> add yourself (docs/RUN_ON_IOS.md)."
          } >> "$GITHUB_STEP_SUMMARY"
