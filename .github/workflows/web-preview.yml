name: Web preview (GitHub Pages)
# Publishes the web build of the app to https://<owner>.github.io/<repo>/ so it can be played
# in plain Safari on any iPhone — no app install, no developer tooling, no iOS update.
# One-time setup (from the phone): repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [apps/mobile/**, packages/**, .github/workflows/web-preview.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web build under the repo sub-path
        working-directory: apps/mobile
        env:
          CI: 1
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # Repo variable (Settings → Secrets and variables → Actions → Variables), e.g. wss://mahjong-signal.fly.dev
          SIGNAL_URL: ${{ vars.SIGNAL_URL }}
        run: |
          npx expo export --platform web --output-dir dist-pages
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll
      - name: Check that Pages is enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain the one-time setup
        if: steps.pages.outcome != 'success'
        run: |
          echo "## Web preview built, but GitHub Pages is not switched on yet" >> $GITHUB_STEP_SUMMARY
          echo "On your phone: this repo → **Settings → Pages → Build and deployment → Source: GitHub Actions**. Then re-run this workflow." >> $GITHUB_STEP_SUMMARY
          echo "::notice::Enable GitHub Pages (Settings → Pages → Source: GitHub Actions) and re-run to publish the web preview."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: apps/mobile/dist-pages

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Where to play, and whether the server accepts this site
        # A browser only lets this site call the game server when the server lists the site's
        # origin in CORS_ORIGINS; native apps need nothing. Ask the server, and say what to set.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SIGNAL_URL: ${{ vars.SIGNAL_URL }}
        run: |
          ORIGIN=$(printf '%s' "$PAGE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          {
            echo "## Play it"
            echo "$PAGE_URL"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          SIGNAL_URL=$(printf '%s' "$SIGNAL_URL" | tr -d '[:space:]')
          if [ -z "$SIGNAL_URL" ]; then
            echo "Offline play only: the repository variable \`SIGNAL_URL\` is not set, so clubs and online tables are off (docs/RUN_FROM_PHONE.md, step 1)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE=$(printf '%s' "$SIGNAL_URL" | sed -E 's#^ws(s?)://#http\1://#; s#^(https?://[^/]+).*#\1#')
          ALLOWED=$(curl -s --max-time 15 -o /dev/null -D - -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "$BASE/api/auth/guest" | tr -d '\r' | grep -i '^access-control-allow-origin:' | head -n 1 | sed -E 's/^[^:]+: *//' || true)
          if [ "$ALLOWED" = "$ORIGIN" ] || [ "$ALLOWED" = "*" ]; then
            echo "Online play: the server at $BASE accepts this site ($ORIGIN)." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "**Online play does not work from this site yet.** The server at $BASE does not list this site's origin, so the browser blocks sign-in, clubs and tables. Run once (origin only, no path), then reload the page:"
              echo ""
              echo '```'
              echo "fly secrets set -a <app> CORS_ORIGINS=$ORIGIN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=The server does not accept this site::Set CORS_ORIGINS=$ORIGIN on the game server (fly secrets set), or clubs and online tables stay unreachable from the web preview (docs/RUN_FROM_PHONE.md, step 1)."
          fi
